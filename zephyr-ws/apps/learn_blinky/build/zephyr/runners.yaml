# Available runners configured by board.cmake.
runners:
- dfu-util
- jlink

# Default flash runner if --runner is not given.
flash-runner: dfu-util

# Default debug runner if --runner is not given.
debug-runner: jlink

# Common runner configuration values.
config:
  board_dir: /home/kyuubi/work/TIL/zephyr-ws/zephyr/boards/weact/mini_stm32h7b0
  # Build outputs:
  elf_file: zephyr.elf
  hex_file: zephyr.hex
  bin_file: zephyr.bin
  # Host tools:
  gdb: /home/kyuubi/zephyr-sdk-1.0.1/gnu/arm-zephyr-eabi/bin/arm-zephyr-eabi-gdb
  openocd: /home/kyuubi/zephyr-sdk-1.0.1/hosttools/sysroots/x86_64-pokysdk-linux/usr/bin/openocd
  openocd_search:
    - /home/kyuubi/zephyr-sdk-1.0.1/hosttools/sysroots/x86_64-pokysdk-linux/usr/share/openocd/scripts

# Runner specific arguments
args:
  dfu-util:
    - --pid=0483:df11
    - --alt=0
    - --dfuse
  jlink:
    - --dt-flash=y
    - --device=STM32H7B0VB
    - --speed=4000
